name: Build

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ main ]
    paths: [ 'build.sh', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

jobs:


  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [aarch64]
    env:
        ARCH: ${{ matrix.arch }}
    outputs:
        RELEASE: ${{ steps.start_build.outputs.RELEASE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arm64
          path: ./*.tar.xz
          archive: false

  build-armv7:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [armv7]
    env:
        ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: armv7
          path: ./*.tar.xz
          archive: false

  push:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7]
    permissions:
      contents: read
      packages: write

    steps:
      
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name
        run: echo "REPONAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
         path: .
         merge-multiple: true

      - name: DEBUG; Check files
        run: ls -la

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: |
            linux/arm64
            linux/arm/v7
          tags: |
            ghcr.io/${{ env.REPONAME }}:latest
            ghcr.io/${{ env.REPONAME }}:${{ needs.build-arm64.outputs.RELEASE }}